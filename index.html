<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>番号札モード（スマホ用）</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="番号札">
<meta name="theme-color" content="#ffffff">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); }
  /* いつもの画面は元の番号札モードと同じ（番号・QR・戻る/次へ）。状態と番号の入力は、押したときだけ出るシート */
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #888888;
    --soft: #f2f2f2;
    --line: #dddddd;
    --accent: #f43f5e;
    --dark: #555555;
    --dim: rgba(0, 0, 0, 0.4);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }
  button { font-family: inherit; color: var(--ink); cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---- いつもの画面（撮影するところ） ---- */
  #stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; touch-action: pan-y; }
  #mode-label { font-size: 12px; color: var(--muted); padding-top: 14px; }
  #progress { font-size: 13px; color: var(--muted); padding-top: 2px; }
  #number { font-size: 72px; font-weight: bold; line-height: 1.05; padding-top: 6px; font-variant-numeric: tabular-nums; }
  #meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding-top: 4px; }
  #meta button { font-size: 17px; font-weight: bold; border: 2px solid var(--ink); border-radius: 6px; padding: 4px 10px; background: var(--bg); }
  #memo { cursor: pointer; }
  #qrwrap { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 8px 0; }
  #qrcode img { display: block; width: 62vw; height: 62vw; max-width: 360px; max-height: 360px; image-rendering: pixelated; }
  body.has-memo #qrwrap { flex: 0 0 auto; }
  body.has-memo #qrcode img { width: 46vw; height: 46vw; max-width: 260px; max-height: 260px; }
  #memo { flex: 1 1 auto; min-height: 0; width: 100%; overflow: hidden; text-align: center; font-size: 24px; font-weight: bold; line-height: 1.3; }
  #memo .free { font-weight: normal; }
  /* 出品サポート：管理番号QR（左）とデータQR（右）を横に並べる。縦に積むと、画面の下が切れる写真でデータQRも切れてしまうため */
  #qrcode2 { display: none; }
  body.support:not(.sep) #qrwrap { gap: 12px; }
  body.support:not(.sep) #qrcode2 { display: block; }
  body.support:not(.sep) #qrcode img { width: 46vw; height: 46vw; max-width: 230px; max-height: 230px; }
  body.support:not(.sep) #qrcode2 img { display: block; image-rendering: pixelated; max-width: 34vw; max-height: 34vw; }
  /* 区切りQR（QR_A）の画面 */
  body.sep #number { font-size: 60px; }
  body.sep #meta, body.sep #memo { display: none; }
  body.sep #qrwrap { flex: 1 1 auto; }
  body.sep #qrcode img { width: 62vw; height: 62vw; max-width: 360px; max-height: 360px; }
  body.sep #stage { background: repeating-linear-gradient(135deg, var(--bg) 0 18px, var(--soft) 18px 36px); }

  #subrow { display: flex; gap: 8px; padding-top: 6px; }
  #stateBtn { flex: 2; font-size: 15px; font-weight: bold; background: var(--soft); border: none; border-radius: 10px; padding: 12px 0; }
  #setBtn { flex: 0 0 64px; font-size: 12px; color: #777777; background: var(--soft); border: none; border-radius: 10px; padding: 12px 0; }
  #jumpToggle { flex: 1; font-size: 12px; color: #777777; background: var(--soft); border: none; border-radius: 10px; padding: 12px 0; }
  #btnrow { display: flex; gap: 8px; padding: 10px 0 max(18px, env(safe-area-inset-bottom, 0px)); }
  #btnrow button { flex: 1; font-size: 20px; font-weight: bold; padding: 18px 0; border: none; border-radius: 12px; }
  #prevBtn { background: #eeeeee; }
  #nextBtn { background: var(--accent); color: #ffffff !important; }

  /* ---- シート共通 ---- */
  .overlay { position: fixed; inset: 0; z-index: 20; background: var(--dim); display: flex; }
  .sheet { background: var(--bg); }

  /* ---- 状態を入れるシート（下から） ---- */
  #stateSheet { flex-direction: column; justify-content: flex-end; }
  #stateSheet .sheet {
    height: 88%; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; gap: 8px;
    padding: 12px max(14px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  }
  #preview { font-size: 15px; font-weight: bold; line-height: 1.35; min-height: 1.35em; max-height: 9em; overflow-y: auto; }
  #preview .ln { padding: 7px 4px; cursor: pointer; }
  #preview .ln.sel { background: var(--soft); }
  #preview .ln.editing { background: #fff1f3; border-left: 3px solid var(--accent); padding-left: 8px; }
  .lineAct { display: flex; gap: 6px; padding: 4px 0 8px; }
  .lineAct button { flex: 1; min-height: 42px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; background: var(--soft); }
  .lineAct button.del { background: var(--accent); color: #ffffff; }
  #sheetMeta { display: flex; flex-wrap: wrap; gap: 6px; }
  #sheetMeta button { font-size: 13px; font-weight: bold; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--bg); padding: 4px 9px; }
  #preview .empty { color: var(--muted); font-weight: normal; font-size: 13px; }
  #preview > div { padding: 2px 0; border-bottom: 1px dashed var(--line); }
  #preview > div:last-child { border-bottom: none; }
  #preview .nextln { color: var(--accent); font-weight: normal; font-size: 13px; }
  #tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #tools button { min-height: 44px; }
  #tools button:disabled { opacity: .35; }
  #note { width: 100%; font-size: 16px; font-family: inherit; line-height: 1.4; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); resize: none; }
  #note:focus { outline: none; border-color: var(--ink); }
  .grid button.add { border-style: dashed; color: var(--muted); font-weight: normal; }
  .sec .row { margin-top: 6px; }
  .mapBtn { margin-top: 6px; width: 100%; font-size: 14px; font-weight: bold; padding: 10px 0; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--bg); }

  /* ---- 倉庫の地図 ---- */
  #mapSheet { z-index: 25; flex-direction: column; justify-content: flex-end; }
  #mapSheet .sheet {
    border-radius: 16px 16px 0 0; display: flex; flex-direction: column; gap: 8px; max-height: 80%;
    padding: 12px max(14px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  }
  .maphead { display: flex; align-items: center; gap: 6px; }
  .maphead b { font-size: 15px; margin-right: auto; }
  .maphead button { width: 40px; height: 36px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; background: var(--soft); }
  #mapBox { overflow: auto; border: 1px solid var(--line); border-radius: 10px; min-height: 0; flex: 1 1 auto; }
  #mapBox svg { display: block; }
  #mapBox .room { cursor: pointer; }
  #mapClose { font-size: 16px; font-weight: bold; padding: 12px 0; border: none; border-radius: 10px; background: #eeeeee; }
  #tools button { font-size: 14px; font-weight: bold; padding: 10px 0; border-radius: 8px; border: none; background: var(--soft); }
  #sepBtn { background: var(--ink) !important; color: #ffffff !important; }
  #clearBtn.arm { background: var(--accent) !important; color: #ffffff !important; }
  .row { display: flex; gap: 6px; }
  .row input { flex: 1; min-width: 0; font-size: 17px; font-family: inherit; padding: 9px; border: 1px solid #cccccc; border-radius: 8px; background: var(--bg); color: var(--ink); }
  .row button { font-size: 15px; font-weight: bold; padding: 0 16px; border-radius: 8px; border: none; background: var(--dark); color: #ffffff; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 9px; padding: 3px; gap: 3px; }
  .seg button { border: none; background: transparent; font-size: 14px; font-weight: bold; padding: 8px 0; border-radius: 7px; color: var(--muted); }
  .seg button[aria-selected="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  #words { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
  /* グループへ飛ぶボタン（一覧の上に固定） */
  #jump, #jumpF { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; scrollbar-width: none; }
  #jump::-webkit-scrollbar, #jumpF::-webkit-scrollbar { display: none; }
  #jump button, #jumpF button { flex: 0 0 auto; min-height: 40px; padding: 0 14px; font-size: 14px; font-weight: bold; border: 1.5px solid var(--line); border-radius: 20px; background: var(--soft); }
  #jump button.hot { border-color: var(--accent); color: var(--accent); background: var(--bg); }
  #quick h2 { color: var(--accent); }
  .recent { margin-bottom: 8px; }
  .recent .lbl { font-size: 11px; font-weight: bold; color: var(--accent); margin: 0 2px 4px; }

  /* 元に戻す（消す・写すの直後5秒だけ） */
  #toast {
    position: fixed; z-index: 40; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
    display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px;
    background: var(--ink); color: #ffffff; border-radius: 12px; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  #toastMsg { flex: 1; min-width: 0; }
  #toastUndo { min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; background: var(--accent); color: #ffffff; }

  /* 設定：別のアイコンへの引っ越し */
  .move { margin-top: 18px; padding: 10px 12px; background: var(--soft); border-radius: 10px; display: flex; flex-direction: column; gap: 8px; }
  .move b { font-size: 14px; }
  .move button { min-height: 44px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; background: var(--dark); color: #ffffff; }
  .move textarea { width: 100%; font-size: 13px; font-family: inherit; padding: 8px; border: 1px solid #cccccc; border-radius: 8px; background: var(--bg); color: var(--ink); resize: none; }
  .grid.c2 { grid-template-columns: 1fr 1fr; }
  .grid.c2 button { text-align: left; padding: 6px 10px; }
  .sec h2 { font-size: 11px; font-weight: bold; color: var(--muted); letter-spacing: .08em; margin: 8px 2px 4px; }
  .grid { display: grid; gap: 5px; grid-template-columns: repeat(4, 1fr); }
  .grid.c3 { grid-template-columns: repeat(3, 1fr); }
  .grid.c5 { grid-template-columns: repeat(5, 1fr); }
  .grid button { min-height: 44px; font-size: 14px; font-weight: bold; line-height: 1.15; padding: 4px 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .grid.c5 button { font-size: 19px; }
  .grid button:active, .grid button.flash, .grid button.on { background: var(--ink); color: #ffffff; border-color: var(--ink); }
  #doneBtn { font-size: 18px; font-weight: bold; padding: 14px 0; border: none; border-radius: 12px; background: var(--accent); color: #ffffff; }

  /* ---- 番号を指定するシート（元の番号指定と同じ小さな窓） ---- */
  #numModal { align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  #numModal .sheet { border-radius: 14px; padding: 16px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
  #numModal p { font-size: 13px; color: #777777; margin: 0; text-align: center; }
  .idline { display: flex; gap: 8px; align-items: stretch; }
  #preChip { flex: 0 0 64px; border: 1px solid #cccccc; border-radius: 8px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; padding: 3px 0; }
  #preChip b { font-size: 22px; }
  #preChip small { font-size: 10px; color: var(--muted); }
  #preChip.on { background: var(--dark); border-color: var(--dark); color: #ffffff; }
  #preChip.on small { color: #ffffff; }
  #idShow { flex: 1; border: 1px solid #cccccc; border-radius: 8px; text-align: center; font-size: 30px; font-weight: bold; padding: 6px 0; font-variant-numeric: tabular-nums; }
  #idNum.ph { color: #cccccc; }
  .kp { display: grid; gap: 6px; }
  .kp button { font-weight: bold; border: none; border-radius: 8px; background: var(--soft); }
  .kp button:active, .kp button.on { background: var(--dark); color: #ffffff; }
  #digits { grid-template-columns: repeat(3, 1fr); }
  #digits button { height: 46px; font-size: 22px; }
  #digits button.small { font-size: 13px; color: #777777; }
  #letters { grid-template-columns: repeat(7, 1fr); }
  #letters button { height: 40px; font-size: 17px; }
  #numModal .btns { display: flex; gap: 8px; }
  #numModal .btns button { flex: 1; font-size: 15px; font-weight: bold; padding: 12px 0; border: none; border-radius: 8px; }
  #cancelNum { background: #eeeeee; }
  #setNum { background: var(--dark); color: #ffffff !important; }
  #setNum:disabled { background: #cccccc; }
  /* ---- 設定画面（入力とは別の画面） ---- */
  #settings {
    position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; gap: 8px;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  }
  .sethead { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; }
  .sethead h1 { font-size: 18px; margin: 0; }
  #setClose { font-size: 15px; font-weight: bold; background: var(--accent); color: #ffffff; border: none; border-radius: 8px; padding: 10px 18px; }
  #setBody { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); }
  .carry { display: flex; gap: 10px; align-items: center; background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: bold; }
  .carry input { width: 24px; height: 24px; flex: 0 0 auto; accent-color: var(--accent); }
  .carry small { display: block; font-size: 11px; font-weight: normal; color: var(--muted); margin-top: 2px; }
  .mode { background: var(--soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .mode .seg { background: var(--line); }
  .mode .setnote { margin: 0; }
  .modeTitle { font-size: 14px; font-weight: bold; }
  .modeTitle small { font-size: 11px; font-weight: normal; color: var(--muted); margin-left: 8px; }
  .setnote { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 4px 2px 0; }
  .wl { display: flex; flex-direction: column; gap: 4px; }
  .wrow { display: flex; gap: 4px; align-items: center; }
  .wrow span { flex: 1; min-width: 0; font-size: 15px; font-weight: bold; padding: 9px 10px; background: var(--soft); border-radius: 8px; overflow-wrap: anywhere; }
  .wrow button { flex: 0 0 42px; height: 38px; border: none; border-radius: 8px; background: var(--soft); font-size: 15px; font-weight: bold; }
  .wrow button:disabled { opacity: .3; }
  .wrow button.del { color: #777777; }
  .wrow button.del.arm { flex-basis: 64px; background: var(--accent); color: #ffffff; font-size: 13px; }
  #setBody .row { margin-top: 6px; }
  #resetWords { display: block; margin: 18px auto 0; font-size: 12px; background: none; border: none; color: #aaaaaa; text-decoration: underline; }
  #resetWords.arm { color: var(--accent); font-weight: bold; }

  #resetBtn { align-self: center; font-size: 11px; background: none; border: none; color: #aaaaaa; text-decoration: underline; }
  #resetBtn.arm { color: var(--accent); font-weight: bold; }

  /* =====================================================================
     新しい見た目（かんたん／出品サポート）。設定の「使い方」で選んだときだけ body.ui-new が付く。
     「いつもの」は上のCSSのまま（ほかの作業者の画面は変わらない）
     ===================================================================== */
  #carline { display: none; }
  .seg.s3 { grid-template-columns: 1fr 1fr 1fr; }
  #allBtn { display: none; }
  #paneCar .cempty, .rrow { }

  body.ui-new {
    --bg: #f6f7fb; --ink: #0f172a; --muted: #64748b; --soft: #eef1f6; --line: #e2e8f0;
    --accent: #5b5bf5; --accent-soft: #eef0ff; --accent-ink: #3f3fd1; --dark: #334155;
    --dim: rgba(15, 23, 42, 0.45); --card: #ffffff; --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    font-family: 'Inter', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body.ui-new button:focus-visible, body.ui-new input:focus-visible, body.ui-new textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* 撮影する画面 */
  body.ui-new #mode-label { font-size: 11px; letter-spacing: .06em; color: var(--muted); padding-top: 12px; }
  body.ui-new #progress { margin-top: 6px; padding: 3px 12px; font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 999px; }
  body.ui-new #number { font-size: 76px; font-weight: 700; letter-spacing: -.02em; padding-top: 8px; }
  body.ui-new #meta { gap: 8px; padding-top: 6px; }
  body.ui-new #meta button { font-size: 15px; font-weight: 600; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; background: var(--card); box-shadow: 0 1px 2px rgba(15, 23, 42, .06); }
  body.ui-new #qrcode img, body.ui-new #qrcode2 img { background: #ffffff; border-radius: 18px; border: 1px solid var(--line); box-shadow: var(--shadow); }
  body.ui-new #memo { font-size: 24px; font-weight: 700; color: var(--ink); }
  body.ui-new #memo .free { font-weight: 500; color: var(--dark); }
  body.ui-new.sep #stage { background: repeating-linear-gradient(135deg, var(--bg) 0 18px, #eceff6 18px 36px); }

  /* 車の行（出品サポート） */
  body.ui-support #carline {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; max-width: 100%; min-height: 40px; padding: 8px 16px;
    font-size: 14px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border: 1px solid #c7cbff; border-radius: 999px;
  }
  body.ui-support #carline[hidden] { display: none; }
  body.ui-support #carline::after { content: ''; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin-top: -3px; }
  body.ui-support #carline.none { color: var(--muted); background: var(--card); border-style: dashed; border-color: #cbd5e1; }

  /* 下の操作 */
  body.ui-new #subrow { gap: 8px; padding-top: 10px; }
  body.ui-new #stateBtn { font-size: 15px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); border: 1px solid #c7cbff; border-radius: 14px; padding: 14px 0; }
  body.ui-new #setBtn, body.ui-new #jumpToggle { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 0; }
  body.ui-new #btnrow button { font-size: 19px; font-weight: 700; padding: 18px 0; border-radius: 16px; }
  body.ui-new #prevBtn { background: var(--card); border: 1px solid var(--line); color: var(--dark); }
  body.ui-new #nextBtn { background: var(--accent); box-shadow: 0 8px 20px rgba(91, 91, 245, .35); }
  body.ui-new #nextBtn:active { background: var(--accent-ink); }

  /* シート */
  body.ui-new .overlay { background: var(--dim); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  body.ui-new .sheet { background: var(--bg); }
  body.ui-new #stateSheet .sheet { border-radius: 26px 26px 0 0; gap: 10px; padding-top: 8px; box-shadow: 0 -8px 32px rgba(15, 23, 42, .18); }
  body.ui-new #stateSheet .sheet::before { content: ''; flex: none; align-self: center; width: 42px; height: 5px; border-radius: 3px; background: #cbd5e1; margin-bottom: 2px; }
  body.ui-new #sheetMeta button { font-size: 13px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border: 1px solid #c7cbff; border-radius: 999px; padding: 6px 12px; }
  body.ui-new #preview { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; font-size: 15px; }
  body.ui-new #preview > div { border-bottom: 1px solid var(--soft); }
  body.ui-new #preview .ln.sel { background: var(--soft); border-radius: 8px; }
  body.ui-new #preview .ln.editing { background: var(--accent-soft); border-left-color: var(--accent); border-radius: 8px; }
  body.ui-new #preview .nextln { color: var(--accent-ink); }

  body.ui-new .sec h2 { font-size: 11px; color: var(--muted); }
  body.ui-new .grid button { background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); }
  body.ui-new .grid button:active, body.ui-new .grid button.flash, body.ui-new .grid button.on { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  body.ui-new .grid button.add { background: transparent; border-style: dashed; }
  body.ui-new .mapBtn { border: 1px solid #c7cbff; background: var(--accent-soft); color: var(--accent-ink); border-radius: 12px; }
  body.ui-new .recent .lbl { color: var(--accent-ink); }
  body.ui-new #doneBtn { background: var(--accent); border-radius: 16px; box-shadow: 0 8px 20px rgba(91, 91, 245, .3); }
  body.ui-new #toast { background: var(--ink); border-radius: 14px; }
  body.ui-new #toastUndo { background: var(--accent); }

  /* シートのタブごとの見せ方 */
  body.ui-new #note { display: none; order: 4; flex: 1 1 auto; min-height: 140px; font-size: 17px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  body.ui-new .sheet[data-tab="memo"] #note { display: block; }
  body.ui-new .sheet[data-tab="place"] #tools, body.ui-new .sheet[data-tab="car"] #tools { display: none; }
  body.ui-new .sheet[data-tab="place"] #preview, body.ui-new .sheet[data-tab="car"] #preview { display: none; }
  body.ui-new #tabsNew { order: 3; }
  body.ui-new #words { order: 4; }
  body.ui-new #doneBtn { order: 9; }
  /* かんたん：状態は「よく使う」だけ。すべての言葉は、ボタンを押したときだけ */
  body.ui-easy:not(.showall) #paneBack .grp, body.ui-easy:not(.showall) #jump { display: none; }
  body.ui-easy:not(.showall) #allBtn { display: block; width: 100%; min-height: 46px; margin-top: 10px; font-size: 14px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border: 1px solid #c7cbff; border-radius: 12px; }

  /* 車タブ */

  .autotag { font-size: 10px; font-weight: 600; color: #15803d; background: #dcfce7; border-radius: 6px; padding: 1px 6px; letter-spacing: 0; }

  .cfield input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91, 91, 245, .18); }
  .cpair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chint { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 6px 2px 0; }
  .cempty { display: flex; flex-direction: column; gap: 8px; padding: 18px 14px; background: var(--card); border: 1px dashed #cbd5e1; border-radius: 14px; margin-top: 8px; }
  .cempty b { font-size: 15px; } .cempty span { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .cgo { min-height: 46px; font-size: 15px; font-weight: 700; color: #ffffff; background: var(--accent); border: none; border-radius: 12px; }
  .cars { display: flex; flex-direction: column; gap: 6px; }
  .cars button { min-height: 46px; text-align: left; padding: 0 14px; font-size: 14px; font-weight: 600; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); }
  .cars button.none { color: var(--muted); font-weight: 500; border-style: dashed; }
  /* 設定：車のルール */
  .rrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .rrow b { grid-column: 1 / -1; font-size: 15px; }

  .rrow input:last-child { grid-column: 1 / -1; }

  /* 車タブ：ポチポチ入力（候補ボタン・年式／走行のパネル） */

  .cchips button { min-height: 44px; padding: 0 14px; font-size: 14px; font-weight: 600; background: var(--card, #fff); border: 1px solid var(--line); border-radius: 999px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .cchips button small { font-size: 10px; font-weight: 500; color: var(--muted); }
  .cchips button.on { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  .cchips button.on small { color: #e0e1ff; }
  .pshow { min-height: 52px; text-align: left; padding: 0 14px; font-size: 18px; font-weight: 600; background: var(--card, #fff); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); }
  .pshow.ph { color: var(--muted); font-weight: 500; font-size: 16px; }
  .pshow.open { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91, 91, 245, .18); }

  .pgrid.p3 { grid-template-columns: repeat(3, 1fr); }
  .pgrid button { min-height: 46px; font-size: 16px; font-weight: 600; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); }
  .pgrid.keys button { min-height: 54px; font-size: 22px; }
  .pgrid button.on { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  .pgrid button.soft, .pad > button.soft { background: var(--soft); color: var(--dark); }
  .pad > button.wide { width: 100%; min-height: 44px; margin-top: 8px; font-size: 14px; font-weight: 600; border: none; border-radius: 10px; }

<body>

<div id="stage">
  <div id="mode-label">番号札モード（スマホ単独）</div>
  <div id="progress"></div>
  <button id="carline" hidden></button>
  <div id="number"></div>
  <div id="meta"></div>
  <div id="qrwrap"><div id="qrcode"></div><div id="qrcode2" aria-hidden="true"></div></div>
  <div id="memo"></div>
</div>

<div id="subrow">
  <button id="stateBtn">状態を入れる</button>
  <button id="jumpToggle">番号を指定</button>
  <button id="setBtn">設定</button>
</div>
<div id="btnrow">
  <button id="prevBtn">← 戻る</button>
  <button id="nextBtn">次へ →</button>
</div>

<div id="stateSheet" class="overlay" hidden>
  <div class="sheet">
    <div id="sheetMeta" hidden></div>
    <div id="preview"></div>
    <div id="tools">
      <button id="sepBtn" title="次の行へ">改行 ↵</button>
      <button id="undoBtn">1つ消す</button>
      <button id="copyPrevBtn">前と同じ</button>
      <button id="clearBtn">全消し</button>
    </div>
    <textarea id="note" rows="2" placeholder="自由記載（なんでも書けます。音声入力も可）" aria-label="自由記載"></textarea>
    <div id="tabs" class="seg" role="tablist">
      <button id="tabBack" role="tab" aria-selected="true">状態</button>
      <button id="tabFront" role="tab" aria-selected="false">型式・倉庫・サイズ</button>
    </div>
    <div id="tabsNew" class="seg" role="tablist" hidden></div>
    <div id="words">
      <div id="paneBack"></div>
      <div id="paneFront" hidden></div>
      <div id="paneCar" hidden></div>
    </div>
    <button id="doneBtn">できた（撮影へ）</button>
  </div>
</div>

<div id="mapSheet" class="overlay" hidden>
  <div class="sheet">
    <div class="maphead">
      <b>地図から倉庫を選ぶ</b>
      <button id="mapOut" aria-label="小さく">－</button>
      <button id="mapIn" aria-label="大きく">＋</button>
    </div>
    <div id="mapBox"></div>
    <button id="mapClose">閉じる</button>
  </div>
</div>

<div id="numModal" class="overlay" hidden>
  <div class="sheet">
    <p id="numTitle">番号を直接指定して進める</p>
    <div class="idline">
      <button id="preChip" aria-label="記号を変える"><small>記号</small><b id="preChipVal">C</b><small>変える</small></button>
      <div id="idShow" aria-live="polite"><span id="idPre">C</span><span id="idNum"></span></div>
    </div>
    <div id="digits" class="kp" aria-label="番号"></div>
    <div id="letters" class="kp" aria-label="記号" hidden></div>
    <div class="btns">
      <button id="cancelNum">キャンセル</button>
      <button id="setNum" disabled>設定</button>
    </div>
    <button id="resetBtn" hidden>入力した控えを全部消して最初から</button>
  </div>
</div>

<div id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastUndo">元に戻す</button></div>

<div id="settings" hidden>
  <div class="sethead">
    <h1>設定</h1>
    <button id="setClose">閉じる</button>
  </div>
  <div class="mode" id="uiBox">
    <div class="modeTitle">使い方<small>このスマホだけの設定です</small></div>
    <div class="seg s3" role="radiogroup" aria-label="使い方">
      <button id="uiClassic" role="radio" aria-selected="true">いつもの</button>
      <button id="uiEasy" role="radio" aria-selected="false">かんたん</button>
      <button id="uiSupport" role="radio" aria-selected="false">出品サポート</button>
    </div>
    <p class="setnote" id="uiNote"></p>
  </div>
  <div class="mode">
    <div class="modeTitle">撮り方<small>このスマホだけの設定です。使う人ごとに選べます</small></div>
    <div class="seg" role="radiogroup" aria-label="撮り方">
      <button id="modeNormal" role="radio" aria-selected="true">いつもの（番号だけ）</button>
      <button id="modeSep" role="radio" aria-selected="false">区切りAをはさむ</button>
    </div>
    <p class="setnote" id="modeNote"></p>
  </div>
  <label class="carry" for="supChk">
    <input id="supChk" type="checkbox">
    <span>出品サポート：データQRも出す<small>管理番号QRの右に、型式・倉庫・サイズ・状態を入れた小さなQRを足します（出品アシスタントが写真から自動で読みます）。管理番号QRは今までと同じです。ふだんはオフのままで大丈夫です</small></span>
  </label>
  <label class="carry" for="carryChk">
    <input id="carryChk" type="checkbox">
    <span>型式を次の番号へ引き継ぐ<small>同じ車の部品を続けて撮るときに便利です</small></span>
  </label>
  <label class="carry" for="carryWhChk">
    <input id="carryWhChk" type="checkbox">
    <span>倉庫も次の番号へ引き継ぐ<small>同じ倉庫に置く部品が続くときはオンに。オフなら、倉庫は番号ごとに空から始まります（サイズ・状態は、いつも番号ごとに空から）</small></span>
  </label>
  <p class="setnote">番号が消えないように：iPhoneは Safari の共有ボタン →「ホーム画面に追加」で作ったアイコンから開いてください（Safariで開くと、7日ほど使わないと番号が消えることがあります）。</p>
  <div class="seg s3" role="tablist">
    <button id="setTabWords" role="tab" aria-selected="true">状態の言葉</button>
    <button id="setTabModels" role="tab" aria-selected="false">型式</button>
    <button id="setTabCars" role="tab" aria-selected="false">車のルール</button>
  </div>
  <div id="setBody"></div>
</div>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

    b.classList.remove('arm'); b.textContent = '全消し';
    keepForUndo('全部消しました');
    var m = memo(cur()); m.tokens = []; m.model = ''; m.wh = ''; m.size = ''; m.note = ''; m.vc = null;
    editLine = null; selLine = null;
    $('note').value = '';
    render();
  });

  // ---- 番号の移動 ----
  // 区切りQRをはさむときは「番号 → 区切りA → 次の番号」。S.onSep は「今の番号の手前の区切りA」を出している印
  function goNext() {
    editLine = null; selLine = null;
    if (S.onSep && sepOn()) { S.onSep = false; render(); return; }
    if (S.idx < S.generated.length - 1) S.idx += 1;
    else pushId(S.prefix, S.nextNum);
    S.onSep = sepOn();
    render();
  }
  function goPrev() {
    editLine = null; selLine = null;
    if (S.onSep && sepOn()) {
      if (S.idx > 0) { S.idx -= 1; S.onSep = false; render(); }
      return;
    }
    if (sepOn()) { S.onSep = true; render(); return; }
    if (S.idx > 0) { S.idx -= 1; render(); }
  }
  $('nextBtn').addEventListener('click', goNext);
  $('prevBtn').addEventListener('click', goPrev);

  // 左右にはらうと次へ／戻る（元の番号札モードと同じ）
  var px = null, py = null;
  $('stage').addEventListener('pointerdown', function (e) { px = e.clientX; py = e.clientY; });
  $('stage').addEventListener('pointerup', function (e) {
    if (px === null) return;
    var dx = e.clientX - px, dy = e.clientY - py;
    px = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? goNext() : goPrev(); }
  });
  $('stage').addEventListener('pointercancel', function () { px = null; });

  // ---- 番号を指定（記号は9999まで変わらないので、ふだんは数字だけ） ----
  var draftP = 'C', draftN = '', pickMode = false;
  try { draftP = localStorage.getItem(PRE_KEY) || draftP; } catch (e) {}
  function drawDraft() {
    $('idPre').textContent = draftP;
    $('preChipVal').textContent = draftP;
    $('idNum').textContent = draftN || '0000';
    $('idNum').classList.toggle('ph', !draftN);
    $('preChip').classList.toggle('on', pickMode);
    $('letters').hidden = !pickMode;
    $('digits').hidden = pickMode;
    document.querySelectorAll('#letters [data-l]').forEach(function (b) {
      b.classList.toggle('on', draftP === b.dataset.l);
    });
    $('setNum').disabled = pickMode || !draftN;
  }
  (function buildKeys() {
    var L = $('letters');
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function (c) {
      var b = document.createElement('button'); b.textContent = c; b.dataset.l = c;
      b.addEventListener('click', function () { buzz(); draftP = c; pickMode = false; drawDraft(); });
      L.appendChild(b);
    });
    $('preChip').addEventListener('click', function () { buzz(); pickMode = !pickMode; drawDraft(); });

    var D = $('digits');
    ['1','2','3','4','5','6','7','8','9','1つ消す','0','クリア'].forEach(function (k) {
      var b = document.createElement('button'); b.textContent = k;
      if (k.length > 1) b.className = 'small';
      b.addEventListener('click', function () {
        buzz();
        if (k === '1つ消す') draftN = draftN.slice(0, -1);
        else if (k === 'クリア') draftN = '';
        else if (draftN.length < 4 && !(draftN === '' && k === '0')) draftN += k;
        drawDraft();
      });
      D.appendChild(b);
    });
  })();

  function openNum(jump) {
    $('numModal').hidden = false;
    $('cancelNum').hidden = !jump;
    $('resetBtn').hidden = !jump;
    $('numTitle').textContent = jump ? '番号を直接指定して進める' : '記号と開始番号を入れてください';
    if (jump && S) draftP = S.prefix;
    draftN = ''; pickMode = false;
    drawDraft();
  }
  $('jumpToggle').addEventListener('click', function () { openNum(true); });
  $('cancelNum').addEventListener('click', function () { $('numModal').hidden = true; });
  $('setNum').addEventListener('click', function () {
    var p = draftP, n = parseInt(draftN, 10);
    if (!/^[A-Z]{1,3}$/.test(p) || !(n >= 1 && n <= MAX)) return;
    try { localStorage.setItem(PRE_KEY, p); } catch (e) {}
    if (!S) S = { prefix: p, nextNum: n, generated: [], idx: -1, memos: {} };
    pushId(p, n);
    S.onSep = false;
    $('numModal').hidden = true;
    render();
    keepAwake();
  });
  var resetTimer = null;
  $('resetBtn').addEventListener('click', function () {
    var b = $('resetBtn');
    if (!b.classList.contains('arm')) {
      b.classList.add('arm'); b.textContent = 'もう一度押すと全部消えます';
      resetTimer = setTimeout(function () { b.classList.remove('arm'); b.textContent = '入力した控えを全部消して最初から'; }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  });

  // 撮影中に画面が消えないように（使えない環境では何もしない）
  var lock = null;
  function keepAwake() {
    try {
      if (navigator.wakeLock && !lock) navigator.wakeLock.request('screen').then(function (l) {
        lock = l; l.addEventListener('release', function () { lock = null; });
      }).catch(function () {});
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S) keepAwake(); });
  window.addEventListener('resize', function () { if (S) fit(); });

  // ---- 起動 ----
  S = load();
  // 以前の「型式を追加」で足した型式は、設定の一覧へ移す
  if (S && S.custom && S.custom.length) {
    S.custom.forEach(function (m) { if (W.models.indexOf(m) < 0) W.models.push(m); });
    delete S.custom; saveWords();
  }
  applyUI();
  buildPanels();
  if (S && S.generated && S.generated.length) {
    S.memos = S.memos || {};
    render(); keepAwake();
  } else {
    S = null;
    openNum(false);
  }
})();
</script>

</body>
</html>
